name: Test

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@^24.20.0
          cache: true

      - name: Install dependencies
        run: pnpm ci

      - name: Run Type check
        run: pnpm type-check

      - name: Run linter
        run: pnpm lint
