name: Deploy website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Run build
        run: pnpm run build

      - name: Run linter
        run: pnpm lint

      - name: Deploy website
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy
          folder: dist
          single-commit: true

      - name: Trigger Hook
        run: curl -s "${{ secrets.BT_WEBHOOK_URL }}"
